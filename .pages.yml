media:
  input: assets
  output: /assets
  extensions:
    - jpg
    - jpeg
    - png
    - webp

content:
  - name: projects
    label: Website Projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: description
        label: Project Description
        type: text
      - name: image
        label: Project Photo
        type: image
