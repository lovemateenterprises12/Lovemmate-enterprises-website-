
  media:
  input: assets
  output: /assets
  extensions:
    - jpg
    - jpeg
    - png
    - webp

content:
  - name: projects
    label: Website Projects
    type: collection
    path: projects
    format: json
    filename: "{primary}.json"
    fields:
      - name: title
        label: Project Name
        type: string
      - name: description
        label: Project Description
        type: text
      - name: image
        label: Project Photo
        type: image