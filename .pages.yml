media:
  input: projects
  output: /projects
  extensions:
    - jpg
    - jpeg
    - png
    - webp

content:
  - name: projects
    label: Website Projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project Name
        type: string
      - name: description
        label: Project Description
        type: text
      - name: image
        label: Project Photo
        type: image
        options:
          path: projects